  - id: E2-T4
    epic: 02-pantalla
    slug: app-behavior
    priority: p0
    title: |-
      Add the page behaviour in app.js
    dependencies: [E2-T2, E2-T3]
    files:
      - lib/vdl_btz/gui/assets/app.js
      - lib/vdl_btz/gui/assets/index.html
      - test/gui_assets_test.rb
    new_files:
      - lib/vdl_btz/gui/assets/app.js
    direction: |-
      La lógica del navegador no se puede ejecutar en CI sin un navegador, así que el contrato se comprueba de forma estática (ids, rutas y construcciones prohibidas) y el comportamiento real queda en la lista de lanzamiento. Escribe funciones pequeñas (`api(ruta, opciones)`, `renderJobs(lista)`, `pollState()`). Nada de frameworks.
    do:
      - |-
        `lib/vdl_btz/gui/assets/app.js` — JavaScript sin dependencias ni `import`, en modo estricto, que usa `fetch` con la cabecera `X-VDL-Token` (valor del `<meta name="vdl-token">`). Comportamiento: (1) al cargar, rellena `dateline` con `N°01 · <Estación> <año> · v<version>` (estación por mes del equipo: dic–feb Invierno, mar–may Primavera, jun–ago Verano, sep–nov Otoño; versión de `GET /api/state`); (2) pide `GET /api/state`; si `setup.ytdlp` o `setup.deno` es falso muestra `#setup` (quita el atributo `hidden`), llama `POST /api/setup` y consulta `/api/state` cada 500 ms actualizando `#setup-label` y `#setup-progress` (`value`/`max`) hasta que `ytdlp` sea verdadero y `running` falso (si `setup.error`, lo muestra en `#msg`); (3) envía `POST /api/ping` cada 2000 ms; (4) el formulario `#form-add` envía `POST /api/jobs` con las URLs de `#urls` (una por línea, vacías descartadas), `audio` según `#mode-audio` y `quality` de `#quality`; los errores `4xx` se muestran en `#msg` con el `error.message`; (5) consulta `GET /api/jobs` cada 500 ms mientras haya trabajos `queued` o `running` y cada 2000 ms si no, y pinta `#jobs` (un `<li>` por trabajo: número `01`, título, plataforma, estado en mayúsculas, un `<progress max="100">`, botón Cancelar → `POST /api/jobs/<id>/cancel`, y si `done` botón Abrir carpeta → `POST /api/open` con `{id}`); `#empty` se oculta cuando hay trabajos; (6) `#btn-save-config` envía `POST /api/config` con `output`, `quality`, `cookies` (`none` si se deja vacío) y `#btn-update-engine` envía `POST /api/engine/update`; (7) `#theme-toggle` alterna `data-theme` entre automático (sin atributo), `light` y `dark`, guardando la elección en `localStorage` dentro de `try/catch`.
      - |-
        REGLA DE SEGURIDAD: los títulos y errores vienen de sitios remotos y no son de confianza. El JavaScript escribe SIEMPRE con `textContent`/`createElement`/`setAttribute`; no usa `innerHTML`, `outerHTML`, `insertAdjacentHTML`, `eval(` ni `document.write`. Los mensajes de estado se escriben en `#msg` (`role="status"`, `aria-live="polite"`).
      - |-
        `lib/vdl_btz/gui/assets/index.html` — si hace falta, ajustar atributos (por ejemplo `hidden` en `#setup`, `type="button"` en los botones que no envían el formulario) sin cambiar los ids del contrato DOM.
      - |-
        `test/gui_assets_test.rb` — añadir comprobaciones estáticas sobre `app.js`: no contiene ninguna de las cinco construcciones prohibidas; cada literal de `getElementById("...")` existe como `id="..."` en `index.html`; contiene las cadenas `/api/ping`, `/api/state`, `/api/jobs`, `/api/setup`, `/api/config`, `/api/engine/update`, `/api/open` y `X-VDL-Token`; y, solo si `node` está instalado (`system("node --version", out: File::NULL, err: File::NULL)`), `node --check` sobre el archivo devuelve 0 (si no, `skip`).
    acceptance:
      - |-
        WHEN `app.js` is read THE SYSTEM SHALL contain none of `innerHTML`, `outerHTML`, `insertAdjacentHTML`, `eval(` and `document.write`.
      - |-
        WHEN every `getElementById("<id>")` literal in `app.js` is extracted THE SYSTEM SHALL find each `<id>` as an `id` attribute in `index.html`.
      - |-
        WHEN `app.js` is read THE SYSTEM SHALL contain the strings `/api/ping`, `/api/state`, `/api/jobs`, `/api/setup`, `/api/config`, `/api/engine/update`, `/api/open` and `X-VDL-Token`.
      - |-
        WHEN `GET /assets/app.js` is requested THE SYSTEM SHALL respond `200` with `Content-Type: text/javascript; charset=utf-8`.
      - |-
        WHEN `node` is installed and `node --check lib/vdl_btz/gui/assets/app.js` runs THE SYSTEM SHALL exit 0.
    verify:
      - |-
        ruby -Ilib -Itest test/gui_assets_test.rb  # expect: exit 0, 0 failures, 0 errors (the node syntax case is skipped when node is missing)
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
  - id: E2-T5
    epic: 02-pantalla
    slug: window-shell
    priority: p0
    title: |-
      Open the app window with browser fallback
    dependencies: [E2-T2, E2-T4]
    files:
      - lib/vdl_btz/gui/shell.rb
      - lib/vdl_btz/os.rb
      - lib/vdl_btz/cli.rb
      - lib/vdl_btz.rb
      - test/gui_shell_test.rb
    new_files:
      - lib/vdl_btz/gui/shell.rb
      - test/gui_shell_test.rb
    direction: |-
      `Shell` no abre nada por sí solo en los tests: todo lo que toca el sistema entra por parámetros inyectables. Se usa un perfil propio de Chromium (`--user-data-dir`) para no tocar el del usuario y para que la ventana sea un proceso nuevo. Cerrar la ventana provoca que dejen de llegar `POST /api/ping` y el servidor se apaga solo a los 20 s.
    do:
      - |-
        `lib/vdl_btz/os.rb` — método de módulo `OS.open_url(url)`: ejecuta `Process.spawn(*args, out: File::NULL, err: File::NULL)` + `Process.detach` con `args` = `["open", url]` (macOS), `["cmd", "/c", "start", "", url]` (Windows) o `["xdg-open", url]` (Linux); devuelve `true`, o `false` si lanza `SystemCallError`. Siempre array de argumentos.
      - |-
        `lib/vdl_btz/gui/shell.rb` — módulo `VdlBtz::GUI::Shell`. `Shell.window_args(exe, url, profile_dir)` devuelve exactamente `[exe, "--app=#{url}", "--user-data-dir=#{profile_dir}", "--no-first-run", "--window-size=980,780"]`. `Shell.candidates(os, env: ENV)` con `os` en `:mac`, `:windows` o `:linux` devuelve la lista ordenada del contrato de la ventana (plano §19.6; en la épica, sección Contracts). `Shell.launch(url, os: <símbolo del sistema actual>, spawner: Process.method(:spawn), exists: File.method(:file?), which: OS.method(:which), opener: OS.method(:open_url), profile_dir: File.join(Paths.home, "gui-profile"))`: recorre los candidatos (en macOS/Windows rutas absolutas comprobadas con `exists`; en Linux nombres resueltos con `which`), con el primero disponible lanza `spawner.call(*window_args(...), out: File::NULL, err: File::NULL)` y devuelve `:app_window`; si no hay ninguno y `opener.call(url)` es verdadero devuelve `:browser`; si no, `:manual`.
      - |-
        `lib/vdl_btz/cli.rb` — `CLI.new` acepta `shell: GUI::Shell`. En `gui`, cuando NO se pasa `--no-window`: el servidor se crea con `idle_timeout` = el valor de `--idle-timeout` o 20, tras imprimir la línea `URL:` se llama `@shell.launch(url)` y, si devuelve `:manual`, se imprime `Abre esta dirección en tu navegador: <url>`; se elimina el error «La ventana todavía no está disponible». Con `--no-window` NO se llama a `@shell.launch` y no hay `idle_timeout` salvo que se indique. `lib/vdl_btz.rb` — `require_relative "vdl_btz/gui/shell"`.
      - |-
        `test/gui_shell_test.rb` — con `spawner`, `exists`, `which` y `opener` falsos que registran las llamadas: `window_args` literal; `candidates(:mac)` igual a la lista del contrato; `candidates(:windows, env: {...})` con directorios inventados produce las rutas esperadas; `launch` devuelve `:app_window` y el `spawner` recibe los argumentos exactos cuando `exists` acepta el primer candidato; `:browser` cuando no hay candidatos y `opener` devuelve verdadero (y `opener` recibe la URL); `:manual` cuando tampoco abre; y un caso con `CLI#run(["gui", "--idle-timeout", "1"])` y un `shell` falso: el falso recibe una URL con la forma `http://127.0.0.1:<puerto>/?t=<token>`, el servidor se apaga por inactividad y `run` devuelve 0; con `--no-window` el falso no recibe llamadas.
    acceptance:
      - |-
        WHEN `Shell.window_args(exe, url, profile_dir)` is called THE SYSTEM SHALL return exactly `[exe, "--app=<url>", "--user-data-dir=<profile_dir>", "--no-first-run", "--window-size=980,780"]`.
      - |-
        WHEN `Shell.candidates(:mac)` is called THE SYSTEM SHALL return, in this order, `/Applications/Google Chrome.app/Contents/MacOS/Google Chrome`, `/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge`, `/Applications/Brave Browser.app/Contents/MacOS/Brave Browser` and `/Applications/Chromium.app/Contents/MacOS/Chromium`.
      - |-
        WHEN `Shell.launch` finds an existing candidate THE SYSTEM SHALL spawn it with `window_args` and return `:app_window`; WHEN none exists and the opener succeeds it SHALL return `:browser`; otherwise `:manual`.
      - |-
        WHEN `OS.open_url` builds its command THE SYSTEM SHALL use an argument array `["open", url]` on macOS, `["cmd", "/c", "start", "", url]` on Windows and `["xdg-open", url]` on Linux, never a shell string.
      - |-
        WHEN `vdl-btz gui` runs without `--no-window` THE SYSTEM SHALL start the server with `idle_timeout` 20 unless overridden, print the `URL:` line, call `Shell.launch` with that URL and, when it returns `:manual`, print `Abre esta dirección en tu navegador: <url>`.
      - |-
        WHEN `vdl-btz gui --no-window` runs THE SYSTEM SHALL NOT call `Shell.launch`.
    verify:
      - |-
        ruby -Ilib -Itest test/gui_shell_test.rb  # expect: exit 0, 0 failures, 0 errors
      - |-
        ruby -Ilib -Itest test/gui_boot_test.rb  # expect: exit 0, 0 failures, 0 errors (the --no-window path still works end to end)
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
  - id: E3-T1
    epic: 03-empaquetado
    slug: macos-package
    priority: p1
    title: |-
      Package the macOS app bundle and dmg
    dependencies: [E2-T5]
    files:
      - packaging/macos/make_app.sh
      - .github/workflows/build.yml
      - .gitignore
      - test/packaging_test.rb
    new_files:
      - packaging/macos/make_app.sh
      - test/packaging_test.rb
    direction: |-
      El empaquetado reutiliza el binario de Tebako ya generado; el `.app` solo añade un lanzador. La firma *ad-hoc* no evita el aviso de Gatekeeper al descargar (eso exige cuenta de pago), pero deja la app con firma válida; el README explica cómo abrirla. No generes icono `.icns` en este cambio.
    do:
      - |-
        `packaging/macos/make_app.sh` — script POSIX `sh` con `set -eu`, uso `make_app.sh <binario> <arch> <version> <outdir>` (sale con estado 64 e imprime el uso si faltan argumentos). Crea `<outdir>/vdl-btz.app/Contents/MacOS/` y `Contents/`; copia `<binario>` a `Contents/MacOS/vdl-btz` (permiso 755); escribe `Contents/MacOS/vdl-btz-launcher` (permiso 755) con exactamente `#!/bin/sh` y la línea `exec "$(dirname "$0")/vdl-btz" gui`; escribe `Contents/Info.plist` (plist XML) con `CFBundleName` `vdl-btz`, `CFBundleDisplayName` `vdl-btz`, `CFBundleIdentifier` `com.batuzav.vdl-btz`, `CFBundleExecutable` `vdl-btz-launcher`, `CFBundlePackageType` `APPL`, `CFBundleShortVersionString` y `CFBundleVersion` = `<version>`, `LSMinimumSystemVersion` `15.0`, `NSHighResolutionCapable` `true`. Después ejecuta `codesign --force --deep -s - <app>` (firma *ad-hoc*, gratuita) y `hdiutil create -volname vdl-btz -srcfolder <app> -ov -format UDZO <outdir>/vdl-btz-<arch>.dmg`. El script se ejecuta solo en macOS.
      - |-
        `.github/workflows/build.yml` — en el job `binary`, después del paso de la prueba rápida y antes de `upload-artifact`, añadir el paso `Empaquetar app de macOS` con `if: runner.os == 'macOS'` que ejecute `sh packaging/macos/make_app.sh vdl-btz-${{ matrix.target }} ${{ matrix.target }} "$(ruby -Ilib -e 'require "vdl_btz"; print VdlBtz::VERSION')" dist`; y un `actions/upload-artifact` con `if: runner.os == 'macOS'`, `name: vdl-btz-${{ matrix.target }}-app` y `path: dist/*.dmg`. No cambiar los pasos ni la matriz existentes.
      - |-
        `.gitignore` — añadir la línea `/dist/` (las salidas de empaquetado no se versionan).
      - |-
        `test/packaging_test.rb` — usa un binario falso (`#!/bin/sh` + `echo stub`) en un directorio temporal. Casos solo de macOS (`skip` si `RbConfig::CONFIG["host_os"]` no contiene `darwin`): el script crea la estructura, `plutil -lint` del `Info.plist` termina en 0 y `plutil -extract CFBundleIdentifier raw` devuelve `com.batuzav.vdl-btz`, `codesign --verify --deep --strict` termina en 0, `hdiutil verify` del `.dmg` termina en 0. Casos en macOS y Linux (se omiten con `skip` en Windows, donde no hay `sh` fiable): ejecutar `sh packaging/macos/make_app.sh` sin argumentos termina con estado 64 (el script comprueba el número de argumentos ANTES de cualquier otra cosa, así que el resultado no depende del sistema). Caso en todos los sistemas: el workflow se parsea con `YAML.load_file` y contiene un paso cuyo `run` menciona `packaging/macos/make_app.sh` con `if` igual a `runner.os == 'macOS'`.
    acceptance:
      - |-
        WHEN `sh packaging/macos/make_app.sh <binary> <arch> <version> <outdir>` runs on macOS THE SYSTEM SHALL create `<outdir>/vdl-btz.app/Contents/MacOS/vdl-btz`, an executable `Contents/MacOS/vdl-btz-launcher` and `Contents/Info.plist`.
      - |-
        WHEN the launcher file is read THE SYSTEM SHALL contain the line `exec "$(dirname "$0")/vdl-btz" gui`.
      - |-
        WHEN `plutil -lint` runs on the generated `Info.plist` THE SYSTEM SHALL exit 0, with `CFBundleIdentifier` equal to `com.batuzav.vdl-btz`, `CFBundleExecutable` equal to `vdl-btz-launcher`, `CFBundleShortVersionString` equal to `<version>` and `LSMinimumSystemVersion` equal to `15.0`.
      - |-
        WHEN `codesign --verify --deep --strict` runs on the generated app THE SYSTEM SHALL exit 0, and WHEN `hdiutil verify` runs on `<outdir>/vdl-btz-<arch>.dmg` THE SYSTEM SHALL exit 0.
      - |-
        WHEN the script is run with missing arguments THE SYSTEM SHALL exit with status 64 and print a usage line.
      - |-
        WHEN `.github/workflows/build.yml` is parsed as YAML THE SYSTEM SHALL be valid and its `binary` job SHALL contain a step running `packaging/macos/make_app.sh` guarded by `runner.os == 'macOS'`, followed by an artifact upload of `dist/*.dmg`.
    verify:
      - |-
        ruby -Ilib -Itest test/packaging_test.rb  # expect: exit 0, 0 failures, 0 errors (macOS-only cases are skipped elsewhere)
      - |-
        ruby -ryaml -e 'YAML.load_file(".github/workflows/build.yml")'  # expect: exit 0
      - |-
        sh packaging/macos/make_app.sh; test $? -eq 64  # expect: exit code 64 (usage) -> this line exits 0
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
  - id: E3-T2
    epic: 03-empaquetado
    slug: linux-package
    priority: p1
    title: |-
      Package the Linux AppImage
    dependencies: [E3-T1]
    files:
      - packaging/linux/make_appimage.sh
      - packaging/linux/vdl-btz.desktop
      - packaging/linux/vdl-btz.svg
      - .github/workflows/build.yml
      - test/packaging_test.rb
    new_files:
      - packaging/linux/make_appimage.sh
      - packaging/linux/vdl-btz.desktop
      - packaging/linux/vdl-btz.svg
    direction: |-
      `--appimage-extract-and-run` evita depender de FUSE en el servidor de CI. `appimagetool` se descarga de la etiqueta móvil `continuous` (no hay versión fija verificable; queda anotado como riesgo). La app abre una ventana de Chrome/Chromium/Edge si existe; si no, el navegador por defecto.
    do:
      - |-
        `packaging/linux/vdl-btz.desktop` — archivo de entrada de escritorio con exactamente las claves `[Desktop Entry]`, `Type=Application`, `Name=vdl-btz`, `Comment=Descarga videos de TikTok, YouTube, Instagram y Facebook`, `Exec=vdl-btz gui`, `Icon=vdl-btz`, `Terminal=false`, `Categories=Network;Utility;`.
      - |-
        `packaging/linux/vdl-btz.svg` — icono SVG bien formado (`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" ...>`): un cuadrado de papel `#ece9e1` con borde de 2 px `#000000` y las letras `vdl` en negro (`<text>` en la fuente `monospace`, `font-weight` 700, centradas). Sin dependencias externas.
      - |-
        `packaging/linux/make_appimage.sh` — script POSIX `sh` con `set -eu`, uso `make_appimage.sh <binario> <arch> <outdir> [--appdir-only]` (sin argumentos obligatorios → estado 64 y uso). Construye `<outdir>/vdl-btz.AppDir` con: `usr/bin/vdl-btz` (el binario, 755), `AppRun` (755, contenido `#!/bin/sh`, `HERE="$(dirname "$(readlink -f "$0")")"` y `exec "$HERE/usr/bin/vdl-btz" gui`), `vdl-btz.desktop` y `vdl-btz.svg` copiados desde `packaging/linux/`. Con `--appdir-only` termina ahí con estado 0. Sin esa opción busca `appimagetool` en el `PATH`; si no existe imprime `appimagetool no encontrado` y sale con estado 2; si existe ejecuta `ARCH=<arch> appimagetool --appimage-extract-and-run <AppDir> <outdir>/vdl-btz-<arch>.AppImage` (`<arch>` = `x86_64`).
      - |-
        `.github/workflows/build.yml` — en el job `binary`, antes de `upload-artifact`: un paso `Descargar appimagetool` con `if: runner.os == 'Linux'` que ejecute `curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage && chmod +x appimagetool && sudo mv appimagetool /usr/local/bin/`; un paso `Empaquetar AppImage` con `if: runner.os == 'Linux'` que ejecute `sh packaging/linux/make_appimage.sh vdl-btz-${{ matrix.target }} x86_64 dist`; y un `upload-artifact` con `if: runner.os == 'Linux'`, `name: vdl-btz-${{ matrix.target }}-appimage`, `path: dist/*.AppImage`.
      - |-
        `test/packaging_test.rb` — añadir casos con binario falso (en macOS y Linux; en Windows se omiten con `skip` los que ejecutan `sh` y solo se comprueban con `File.read` los archivos de `packaging/linux/`): `make_appimage.sh <falso> x86_64 <tmp> --appdir-only` termina en 0 y existen `AppRun` ejecutable con la línea `exec "$HERE/usr/bin/vdl-btz" gui`, `usr/bin/vdl-btz`, `vdl-btz.desktop`, `vdl-btz.svg`; el `.desktop` contiene las claves indicadas; el SVG empieza por `<svg` y contiene `xmlns="http://www.w3.org/2000/svg"`; sin `--appdir-only` y con `PATH` que no contiene `appimagetool` (`env PATH=/usr/bin:/bin`) el script termina con estado 2; el workflow tiene un paso con `if` igual a `runner.os == 'Linux'` que menciona `make_appimage.sh`.
    acceptance:
      - |-
        WHEN `sh packaging/linux/make_appimage.sh <binary> x86_64 <outdir> --appdir-only` runs THE SYSTEM SHALL exit 0 and create `<outdir>/vdl-btz.AppDir` containing `usr/bin/vdl-btz`, an executable `AppRun`, `vdl-btz.desktop` and `vdl-btz.svg`.
      - |-
        WHEN `AppRun` is read THE SYSTEM SHALL contain the line `exec "$HERE/usr/bin/vdl-btz" gui`.
      - |-
        WHEN `vdl-btz.desktop` is read THE SYSTEM SHALL contain the lines `Type=Application`, `Name=vdl-btz`, `Exec=vdl-btz gui`, `Icon=vdl-btz`, `Terminal=false` and `Categories=Network;Utility;`.
      - |-
        WHEN `vdl-btz.svg` is read THE SYSTEM SHALL start with `<svg` and contain `xmlns="http://www.w3.org/2000/svg"`.
      - |-
        WHEN the script runs without `--appdir-only` and `appimagetool` is not on `PATH` THE SYSTEM SHALL print `appimagetool no encontrado` and exit with status 2.
      - |-
        WHEN `.github/workflows/build.yml` is parsed as YAML THE SYSTEM SHALL be valid and contain a step guarded by `runner.os == 'Linux'` that runs `packaging/linux/make_appimage.sh`, followed by an artifact upload of `dist/*.AppImage`.
    verify:
      - |-
        ruby -Ilib -Itest test/packaging_test.rb  # expect: exit 0, 0 failures, 0 errors
      - |-
        ruby -ryaml -e 'YAML.load_file(".github/workflows/build.yml")'  # expect: exit 0
      - |-
        sh packaging/linux/make_appimage.sh; test $? -eq 64  # expect: exit code 64 (usage) -> this line exits 0
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
  - id: E3-T3
    epic: 03-empaquetado
    slug: windows-package
    priority: p1
    title: |-
      Build the Windows binary, hidden launcher and installer
    dependencies: [E3-T2]
    files:
      - packaging/windows/vdl-btz.iss
      - packaging/windows/vdl-btz-launcher.vbs
      - .github/workflows/build.yml
      - test/packaging_test.rb
    new_files:
      - packaging/windows/vdl-btz.iss
      - packaging/windows/vdl-btz-launcher.vbs
    direction: |-
      Este paso solo puede verificarse de forma estática en macOS/Linux; la ejecución real en Windows ocurre en GitHub Actions y es experimental (`continue-on-error`) porque Tebako en Windows con el modo `fat` no está probado. Un `.exe` de consola abriría una ventana negra: por eso el instalador crea el acceso directo hacia `wscript.exe` con el lanzador oculto. Usa `PrivilegesRequired=lowest` para que no pida administrador.
    do:
      - |-
        `packaging/windows/vdl-btz-launcher.vbs` — script de Windows Script Host que lanza la app sin ventana de consola: `Set sh = CreateObject("WScript.Shell")`, `dir = CreateObject("Scripting.FileSystemObject").GetParentFolderName(WScript.ScriptFullName)` y `sh.Run """" & dir & "\vdl-btz.exe"" gui", 0, False` (estilo de ventana 0 = oculta, sin esperar).
      - |-
        `packaging/windows/vdl-btz.iss` — script de Inno Setup con `[Setup]`: `AppName=vdl-btz`, `AppVersion={#AppVersion}` (se pasa con `/DAppVersion=...`), `DefaultDirName={autopf}\vdl-btz`, `PrivilegesRequired=lowest` (instala sin ser administrador), `OutputDir=..\..\dist`, `OutputBaseFilename=vdl-btz-windows-x64-setup`, `ArchitecturesAllowed=x64compatible`, `Compression=lzma2`; `[Files]`: `Source: "..\..\vdl-btz-windows-x64.exe"; DestName: "vdl-btz.exe"; DestDir: "{app}"` y `Source: "vdl-btz-launcher.vbs"; DestDir: "{app}"`; `[Icons]`: entrada del menú Inicio `Name: "{autoprograms}\vdl-btz"; Filename: "{sys}\wscript.exe"; Parameters: """{app}\vdl-btz-launcher.vbs"""` y la misma como icono opcional de escritorio (`Tasks: desktopicon`, con `[Tasks]` `Name: "desktopicon"; Description: "Crear un icono en el escritorio"`).
      - |-
        `.github/workflows/build.yml` — (a) añadir a `jobs.binary.strategy.matrix.include` la entrada `{ os: windows-latest, target: windows-x64, experimental: true }` (las entradas `macos-15`, `macos-15-intel` y `ubuntu-24.04` no cambian) y a nivel de job `continue-on-error: ${{ matrix.experimental == true }}`; (b) al paso existente `Preparar carpeta de empaquetado` añadirle `shell: bash` (usa `mkdir` y `cp -R`); (c) a los pasos genéricos existentes `Preparar entorno de Tebako`, `Empaquetar con Tebako`, `Prueba rápida del binario` y al `actions/upload-artifact` genérico (el que sube `vdl-btz-${{ matrix.target }}`) añadirles `if: runner.os != 'Windows'` (en Windows el binario se llama distinto y se empaqueta con pasos propios); (d) añadir estos pasos con `if: runner.os == 'Windows'` y `shell: cmd` o `shell: bash` según se indica, justo antes del paso final de subida: `Preparar MSYS2 para Tebako` (`shell: cmd`) con `call gem install tebako -v 0.15.9`, `call ridk enable ucrt64` (en `cmd`, ejecutar un `.cmd`/`.bat` sin `call` corta el resto del script), `pacman -S --noconfirm git tar bison flex pactoys` y `bash -c "pacboy sync --noconfirm toolchain:p make:p cmake:p boost:p diffutils:p libevent:p double-conversion:p fmt:p glog:p dlfcn:p gtest:p autotools:p ncurses:p libyaml:p"` (cada uno en su línea); `Empaquetar binario de Windows` (`shell: cmd`) con `call ridk enable ucrt64` (cada paso arranca una shell nueva: el entorno de MSYS2 de un paso anterior no se conserva y Tebako lo necesita para compilar), `call tebako setup --Ruby=3.3.7` y `call tebako press --root=stage --entry-point=bin/vdl-btz --output=vdl-btz-windows-x64.exe --Ruby=3.3.7 --mode=fat`; `Prueba rápida del binario de Windows` (`shell: bash`) con `./vdl-btz-windows-x64.exe version`; `Crear instalador` (`shell: cmd`) con `"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=<versión> packaging\windows\vdl-btz.iss` donde `<versión>` sale de `ruby -Ilib -e "require 'vdl_btz'; print VdlBtz::VERSION"` (guárdala antes en una variable de entorno con un paso `shell: bash` que escriba `VDL_VERSION=...` en `$GITHUB_ENV`); y `actions/upload-artifact` con `name: vdl-btz-windows-x64-setup` y `path: dist/vdl-btz-windows-x64-setup.exe`. Inno Setup ya viene preinstalado en la imagen `windows-latest`.
      - |-
        `test/packaging_test.rb` — añadir comprobaciones de contenido (`File.read`): el `.vbs` contiene `Run`, `vdl-btz.exe"" gui` y `, 0, False`; el `.iss` contiene `AppName=vdl-btz`, `PrivilegesRequired=lowest`, `OutputBaseFilename=vdl-btz-windows-x64-setup`, `{sys}\wscript.exe` y `vdl-btz-launcher.vbs`; el workflow, parseado con `YAML.load_file`, tiene los pasos genéricos con `if` igual a `runner.os != 'Windows'` y el paso `Preparar carpeta de empaquetado` con `shell` igual a `bash`, y tiene en `jobs.binary.strategy.matrix.include` entradas con `os` igual a `macos-15`, `macos-15-intel`, `ubuntu-24.04` y `windows-latest` (esta última con `experimental` verdadero) y `jobs.binary.continue-on-error` presente.
    acceptance:
      - |-
        WHEN `vdl-btz-launcher.vbs` is read THE SYSTEM SHALL run `vdl-btz.exe` with the argument `gui` using window style 0 and without waiting (`, 0, False`).
      - |-
        WHEN `vdl-btz.iss` is read THE SYSTEM SHALL declare `AppName=vdl-btz`, `PrivilegesRequired=lowest` and `OutputBaseFilename=vdl-btz-windows-x64-setup`, install `vdl-btz.exe` and `vdl-btz-launcher.vbs`, and create a Start Menu icon whose `Filename` is `{sys}\wscript.exe` with the launcher as parameter.
      - |-
        WHEN `.github/workflows/build.yml` is parsed as YAML THE SYSTEM SHALL be valid and its `jobs.binary.strategy.matrix.include` SHALL contain entries with `os` equal to `macos-15`, `macos-15-intel`, `ubuntu-24.04` and `windows-latest`, the last with `experimental` true.
      - |-
        WHEN the `binary` job definition is read THE SYSTEM SHALL carry `continue-on-error` driven by `matrix.experimental`, so a Windows failure does not fail the macOS and Linux builds.
      - |-
        WHEN the Windows-guarded steps are read THE SYSTEM SHALL include `ridk enable ucrt64`, `tebako press` with `--output=vdl-btz-windows-x64.exe`, an `ISCC.exe` call on `packaging\windows\vdl-btz.iss` and an artifact upload of `dist/vdl-btz-windows-x64-setup.exe`.
      - |-
        WHEN the generic steps `Preparar entorno de Tebako`, `Empaquetar con Tebako` and `Prueba rápida del binario` are read THE SYSTEM SHALL carry `if: runner.os != 'Windows'`, and the step `Preparar carpeta de empaquetado` SHALL declare `shell: bash`.
    verify:
      - |-
        ruby -Ilib -Itest test/packaging_test.rb  # expect: exit 0, 0 failures, 0 errors
      - |-
        ruby -ryaml -e 'YAML.load_file(".github/workflows/build.yml")'  # expect: exit 0
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
  - id: E3-T4
    epic: 03-empaquetado
    slug: readme-desktop
    priority: p1
    title: |-
      Document the desktop app, downloads and OS warnings
    dependencies: [E3-T3]
    files:
      - README.md
      - test/readme_test.rb
    new_files:
      - test/readme_test.rb
    direction: |-
      El README ya tiene instrucciones de instalación con gema y un aviso legal; añade las nuevas secciones y reutiliza el estilo existente (español, tablas, bloques de código). Describe el bloqueo de Gatekeeper/SmartScreen con honestidad: es una limitación asumida del proyecto gratuito.
    do:
      - |-
        `README.md` — añadir, sin borrar el contenido existente del CLI, estas secciones (encabezados exactos de nivel 2): `## App de escritorio` (qué es, que se abre con doble clic, que abre una ventana de Chrome/Edge/Brave/Chromium si existe y si no el navegador, que todo es local y no se publica nada en internet, y que los comandos del CLI como `vdl-btz help` siguen funcionando igual), `## Descargas` (enlace a `https://github.com/batuzav/vdl-btz/releases` y los nombres de archivo `vdl-btz-macos-arm64`, `vdl-btz-macos-x64`, `vdl-btz-linux-x64` y `vdl-btz-windows-x64-setup.exe`, con cuál elegir según el equipo), `## Requisitos de sistema` (macOS 15 o superior, Ubuntu 24.04 o superior, Windows 10/11 de 64 bits; y que el binario necesita internet la primera vez para instalar yt-dlp, ffmpeg y Deno —unos 40 MB, necesario para YouTube—, y que en Linux hace falta `unzip` o un `tar` que abra `.zip`), `## Si el sistema bloquea la app` (macOS: clic derecho → Abrir, o `xattr -d com.apple.quarantine <archivo>`; Windows: aviso de `SmartScreen` → «Más información» → «Ejecutar de todas formas»; explicación de que las apps no están firmadas porque el proyecto no paga certificados) y `## Aviso legal` (uso personal, respetar derechos de autor y términos de cada plataforma).
      - |-
        `test/readme_test.rb` — lee `README.md` y comprueba: existen los cinco encabezados; la sección Descargas contiene los cuatro nombres de archivo y la URL de releases; la sección «Si el sistema bloquea la app» contiene `xattr -d com.apple.quarantine` y `SmartScreen`; la sección Requisitos contiene `macOS 15` y `Ubuntu 24.04`; la sección «App de escritorio» contiene `vdl-btz help`; y todo enlace relativo en forma `](ruta)` (sin `http`, sin `#`) apunta a un archivo que existe.
    acceptance:
      - |-
        WHEN `README.md` is read THE SYSTEM SHALL contain the level-2 headings `## App de escritorio`, `## Descargas`, `## Requisitos de sistema`, `## Si el sistema bloquea la app` and `## Aviso legal`.
      - |-
        WHEN the `## Descargas` section is read THE SYSTEM SHALL name `vdl-btz-macos-arm64`, `vdl-btz-macos-x64`, `vdl-btz-linux-x64` and `vdl-btz-windows-x64-setup.exe` and contain `https://github.com/batuzav/vdl-btz/releases`.
      - |-
        WHEN the `## Si el sistema bloquea la app` section is read THE SYSTEM SHALL contain `xattr -d com.apple.quarantine` and `SmartScreen`.
      - |-
        WHEN the `## Requisitos de sistema` section is read THE SYSTEM SHALL contain `macOS 15` and `Ubuntu 24.04`.
      - |-
        WHEN the `## App de escritorio` section is read THE SYSTEM SHALL contain `vdl-btz help`, stating that CLI commands are unchanged.
      - |-
        WHEN every relative Markdown link in `README.md` is resolved THE SYSTEM SHALL find an existing file for each.
    verify:
      - |-
        ruby -Ilib -Itest test/readme_test.rb  # expect: exit 0, 0 failures, 0 errors
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
  - id: E3-T5
    epic: 03-empaquetado
    slug: webview-spike
    priority: p2
    title: |-
      Add the optional webview technical spike
    dependencies: [E3-T4]
    files:
      - .github/workflows/webview-spike.yml
      - docs/webview-spike.md
    new_files:
      - .github/workflows/webview-spike.yml
      - docs/webview-spike.md
    direction: |-
      Es un experimento aislado: no toca el código de la app ni el workflow `build.yml`. Solo comprueba que la gema compila y carga en cada sistema (nivel 1); empaquetarla con Tebako (nivel 2) queda como trabajo posterior si algún sistema da PASS.
    do:
      - |-
        `.github/workflows/webview-spike.yml` — workflow con `name: Webview spike`, disparador SOLO `workflow_dispatch`, un job `spike` con `runs-on: ${{ matrix.os }}`, `continue-on-error: true` y matriz `os: [macos-15, ubuntu-24.04, windows-latest]` (`fail-fast: false`). Pasos: `actions/checkout@v4`; `ruby/setup-ruby@v1` con `ruby-version: "3.3"`; en Linux (`if: runner.os == 'Linux'`) `sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev`; `gem install webview_ruby2 -v 0.2.6`; y un paso final con `shell: bash` que ejecute `ruby -e 'require "webview_ruby"; puts "WEBVIEW_LOAD_OK"'` y escriba en `$GITHUB_STEP_SUMMARY` la línea `${{ matrix.os }}: PASS` si salió bien o `${{ matrix.os }}: FAIL` si no (sin hacer fallar el trabajo).
      - |-
        `docs/webview-spike.md` — documento en español con el objetivo (comprobar si una ventana nativa con `webview_ruby2` es viable dentro de un binario de Tebako), el método (ejecutar el workflow desde la pestaña Actions) y una tabla con las filas `macOS`, `Linux`, `Windows` y las columnas `Sistema`, `Resultado` (valor inicial `PENDIENTE` en las tres) y `Notas`; más la regla de decisión: «Si un sistema da PASS, el siguiente nivel es empaquetar la gema con Tebako en ese sistema; si falla, se mantiene la ventana de Chrome/Edge (app-window) como versión de producción». Indica que este spike NO forma parte del flujo de lanzamiento.
    acceptance:
      - |-
        WHEN `.github/workflows/webview-spike.yml` is parsed as YAML THE SYSTEM SHALL be valid, be triggered only by `workflow_dispatch` and define a matrix over `macos-15`, `ubuntu-24.04` and `windows-latest`.
      - |-
        WHEN the workflow text is read THE SYSTEM SHALL contain `gem install webview_ruby2 -v 0.2.6` and `require "webview_ruby"` and `WEBVIEW_LOAD_OK`.
      - |-
        WHEN `docs/webview-spike.md` is read THE SYSTEM SHALL contain a table with the rows `macOS`, `Linux` and `Windows`, a `Resultado` column whose initial value is `PENDIENTE`, and the decision rule mentioning `app-window`.
    verify:
      - |-
        ruby -ryaml -e 'w = YAML.load_file(".github/workflows/webview-spike.yml"); t = w["on"] || w[true]; abort("bad trigger") unless t.keys == ["workflow_dispatch"]'  # expect: exit 0
      - |-
        grep -q 'gem install webview_ruby2 -v 0.2.6' .github/workflows/webview-spike.yml  # expect: exit 0
      - |-
        grep -q 'WEBVIEW_LOAD_OK' .github/workflows/webview-spike.yml  # expect: exit 0
      - |-
        grep -q 'PENDIENTE' docs/webview-spike.md  # expect: exit 0
      - |-
        grep -q 'app-window' docs/webview-spike.md  # expect: exit 0
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
