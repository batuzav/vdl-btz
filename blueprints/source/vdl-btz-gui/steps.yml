# FUENTE ÚNICA del plano vdl-btz-gui. Se edita aquí y se ejecuta:
#   ruby blueprints/source/sync.rb vdl-btz-gui          (regenera tasks.json, §9 de blueprint.md y las épicas)
#   ruby blueprints/source/sync.rb vdl-btz-gui --check  (comprueba que nada se desfasó; no escribe)
# No edites a mano lo que hay entre los marcadores GENERATED ni los criterios/verify de tasks.json.
# El `status` de cada tarea vive en tasks.json y el generador lo conserva.
epics:
  - 01-nucleo
  - 02-pantalla
  - 03-empaquetado
steps:
  - id: E1-T1
    epic: 01-nucleo
    slug: gui-server-boot
    priority: p0
    title: |-
      Add local server and gui --no-window command
    dependencies: []
    files:
      - lib/vdl_btz/gui/server.rb
      - lib/vdl_btz.rb
      - lib/vdl_btz/cli.rb
      - test/gui_boot_test.rb
    new_files:
      - lib/vdl_btz/gui/server.rb
      - test/gui_boot_test.rb
    direction: |-
      Empieza por el servidor: un bucle `accept` con un hilo por conexión es suficiente (la app tiene un solo usuario local). Parsea a mano la petición HTTP/1.1; no añadas gemas. El token se genera en el comando, no en el servidor, para que el servidor sea fácil de probar con un token conocido. Mantén `Connection: close` para no tener que gestionar keep-alive.
    do:
      - |-
        `lib/vdl_btz/gui/server.rb` — clase `VdlBtz::GUI::Server` (solo stdlib: `socket`, `json`, `securerandom`, `openssl`). `initialize(token:, handler: nil, port: 0)`; `start` abre `TCPServer.new("127.0.0.1", port)`, acepta conexiones en un hilo de fondo (un hilo por conexión) y devuelve el puerto entero; `stop` cierra el socket; `join` espera hasta que el servidor se detenga. Entiende HTTP/1.1: línea de petición `METHOD SP target SP HTTP/1.x`, cabeceras (claves en minúsculas) hasta la línea en blanco y cuerpo según `Content-Length` (vacío si falta). Responde `HTTP/1.1 <código> <motivo>` con `Content-Type: application/json; charset=utf-8`, `Content-Length` y `Connection: close`.
      - |-
        Rutas propias del servidor: `GET /api/health` → `200` con `{"ok":true,"data":{"version":"<VdlBtz::VERSION>"}}`; `POST /api/shutdown` → `200` con `{"ok":true,"data":{}}` y después `stop`. Toda ruta que empiece por `/api/` exige la cabecera `X-VDL-Token` igual al token (comparar con `OpenSSL.fixed_length_secure_compare` tras comprobar que las longitudes coinciden); si falta o difiere → `401` con `{"ok":false,"error":{"code":"unauthorized","message":"Token inválido"}}`. Cualquier otra ruta → `404` con código `not_found`.
      - |-
        `lib/vdl_btz.rb` — añadir `require_relative "vdl_btz/gui/server"` justo antes de `require_relative "vdl_btz/cli"`.
      - |-
        `lib/vdl_btz/cli.rb` — añadir `when "gui" then gui(argv.drop(1))` al despacho de comandos y un método público `gui(argv)`: con `OptionParser` acepta `--no-window` (obligatorio en este paso) y `--port N` (por defecto 0); si falta `--no-window` lanza `VdlBtz::Error, "La ventana todavía no está disponible; usa --no-window"`. Genera el token con `SecureRandom.hex(16)`, inicia el servidor, imprime exactamente `URL: http://127.0.0.1:<puerto>/?t=<token>` como PRIMERA línea de stdout (con `$stdout.flush`), llama a `server.join` y devuelve `0`. Añadir al texto de `help` la línea `  vdl-btz gui [--no-window]           Abre la aplicación de escritorio`.
      - |-
        `test/gui_boot_test.rb` — lanza el comando real con `Open3.popen3(RbConfig.ruby, "bin/vdl-btz", "gui", "--no-window")`, lee la primera línea de stdout (máximo 10 s), la valida con la expresión `\AURL: http://127\.0\.0\.1:(\d+)/\?t=([0-9a-f]{32})\n\z`, y con `Net::HTTP` comprueba: health con token → 200 y `data.version == VdlBtz::VERSION`; health sin token y con token erróneo → 401 `unauthorized`; ruta inexistente con token → 404; `POST /api/shutdown` con token → 200 y el proceso termina con estado 0 en menos de 5 s. Termina siempre el proceso hijo en un `ensure`.
    acceptance:
      - |-
        WHEN `ruby bin/vdl-btz gui --no-window` starts THE SYSTEM SHALL print as the first line of stdout exactly `URL: http://127.0.0.1:<port>/?t=<token>` where `<port>` is a non-zero integer and `<token>` is 32 lowercase hexadecimal characters.
      - |-
        WHEN `GET /api/health` is requested with header `X-VDL-Token` equal to that token THE SYSTEM SHALL respond `200` with `{"ok":true,"data":{"version":...}}` where `data.version` equals `VdlBtz::VERSION`.
      - |-
        WHEN any `/api/` path is requested without the `X-VDL-Token` header, or with a different value, THE SYSTEM SHALL respond `401` with `{"ok":false,"error":{"code":"unauthorized",...}}`.
      - |-
        WHEN an unknown path is requested with a valid token THE SYSTEM SHALL respond `404` with error code `not_found`.
      - |-
        WHEN `POST /api/shutdown` is requested with the valid token THE SYSTEM SHALL respond `200` and the `gui` process SHALL exit with status 0 within 5 seconds.
      - |-
        WHEN `ruby bin/vdl-btz version` runs THE SYSTEM SHALL still print `vdl-btz <VdlBtz::VERSION>`, and WHEN `ruby bin/vdl-btz` runs with no arguments THE SYSTEM SHALL still print the help text containing `vdl-btz URL` and exit 0.
    verify:
      - |-
        ruby -Ilib -Itest test/gui_boot_test.rb  # expect: exit 0, 0 failures, 0 errors (this runs the real entry point `bin/vdl-btz gui`)
      - |-
        ruby bin/vdl-btz version | grep -q '^vdl-btz [0-9]'  # expect: exit 0 (frozen CLI still works)
      - |-
        ruby bin/vdl-btz | grep -q 'vdl-btz URL'  # expect: exit 0 (no arguments still prints the help)
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
  - id: E1-T2
    epic: 01-nucleo
    slug: gui-server-hardening
    priority: p0
    title: |-
      Harden server with host check, limits and idle timeout
    dependencies: [E1-T1]
    files:
      - lib/vdl_btz/gui/server.rb
      - lib/vdl_btz/cli.rb
      - test/gui_server_test.rb
    new_files:
      - test/gui_server_test.rb
    direction: |-
      Las comprobaciones de seguridad van antes del enrutado para que ninguna ruta futura pueda saltárselas. El temporizador de inactividad es lo que apaga el servidor cuando el usuario cierra la ventana (la página enviará `POST /api/ping` cada 2 s en un paso posterior). Usa `Process.clock_gettime(Process::CLOCK_MONOTONIC)` para medir el tiempo.
    do:
      - |-
        `lib/vdl_btz/gui/server.rb` — añadir, en este orden, antes de despachar cualquier ruta: (1) línea de petición mal formada → `400` código `bad_request`; (2) cabecera `Host` distinta de `127.0.0.1:<puerto>` y de `localhost:<puerto>` → `403` código `bad_host` (defensa contra *DNS rebinding*); (3) `Content-Length` mayor que 65536 → `413` código `too_large` y se cierra la conexión sin leer el cuerpo; (4) si la ruta empieza por `/api/`, token válido o `401 unauthorized`; (5) con token válido, ruta conocida con método no admitido (por ejemplo `POST /api/health`) → `405` código `method_not_allowed` y ruta desconocida → `404 not_found`.
      - |-
        Todas las respuestas (también los errores) llevan `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer` y `Content-Security-Policy: default-src 'self'; img-src 'self' data:; frame-ancestors 'none'`.
      - |-
        Ruta propia nueva: `POST /api/ping` → `200` con `{"ok":true,"data":{}}` (requiere token) y reinicia el temporizador de inactividad. `Server.new` acepta `idle_timeout:` (segundos, `nil` = sin límite): si pasa ese tiempo desde el arranque o desde el último `POST /api/ping` autenticado, el servidor llama a `stop`. Usa un hilo vigilante que compruebe cada 0.25 s.
      - |-
        `lib/vdl_btz/cli.rb` — el comando `gui` acepta `--idle-timeout S` (entero, por defecto sin límite) y lo pasa a `Server.new`.
      - |-
        `test/gui_server_test.rb` — arranca `Server` en proceso con un token conocido (puerto 0) y comprueba con `Net::HTTP`/`TCPSocket` cada criterio: `Host` ajeno → 403, `Content-Length: 70000` → 413, línea de petición `GARBAGE` → 400, `POST /api/health` con token válido → 405, las cuatro cabeceras presentes en una respuesta 200 y en una 404, `idle_timeout: 1` detiene el servidor (`join` vuelve en menos de 4 s) y un `POST /api/ping` cada 0.4 s lo mantiene vivo durante 2 s. Añade un caso con subproceso: `bin/vdl-btz gui --no-window --idle-timeout 2` termina con estado 0 en menos de 6 s.
    acceptance:
      - |-
        WHEN a request carries a `Host` header other than `127.0.0.1:<port>` or `localhost:<port>` THE SYSTEM SHALL respond `403` with error code `bad_host` before any route runs.
      - |-
        WHEN a request announces `Content-Length` greater than 65536 THE SYSTEM SHALL respond `413` with error code `too_large` and close the connection.
      - |-
        WHEN the request line is malformed THE SYSTEM SHALL respond `400` with error code `bad_request`, and WHEN a known path is requested with a valid token and an unsupported method (for example `POST /api/health`) THE SYSTEM SHALL respond `405` with error code `method_not_allowed`.
      - |-
        WHEN any response is sent, including errors, THE SYSTEM SHALL include the headers `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer` and `Content-Security-Policy: default-src 'self'; img-src 'self' data:; frame-ancestors 'none'`.
      - |-
        WHEN the server was created with `idle_timeout: 1` and no authenticated `POST /api/ping` arrives for 1 second THE SYSTEM SHALL stop, and WHEN a ping arrives before the second elapses THE SYSTEM SHALL keep running.
      - |-
        WHEN `ruby bin/vdl-btz gui --no-window --idle-timeout 2` runs and nothing pings it THE SYSTEM SHALL exit with status 0 within 6 seconds.
    verify:
      - |-
        ruby -Ilib -Itest test/gui_server_test.rb  # expect: exit 0, 0 failures, 0 errors
      - |-
        ruby -Ilib -Itest test/gui_boot_test.rb  # expect: exit 0, 0 failures, 0 errors (step 1 gate still passes)
      - |-
        ruby bin/vdl-btz gui --no-window --idle-timeout 2 | head -1 | grep -q '^URL: http://127.0.0.1:[0-9]*/?t=[0-9a-f]\{32\}$'  # expect: exit 0, and the server exits by itself after about 2 s
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
  - id: E1-T3
    epic: 01-nucleo
    slug: downloader-cancel
    priority: p0
    title: |-
      Add cancel support to Downloader
    dependencies: []
    files:
      - lib/vdl_btz/downloader.rb
      - test/downloader_test.rb
    new_files: []
    direction: |-
      El `Downloader` se instancia una vez por trabajo, así que `cancel!` solo afecta a esa descarga. No toques `build_args` ni el parseo de progreso. El `Thread` lector de stderr ya existente termina solo al cerrarse el proceso.
    do:
      - |-
        `lib/vdl_btz/downloader.rb` — (a) añadir el miembro `:canceled` al `Struct` `Result` (queda `Struct.new(:url, :ok, :file, :error, :canceled, keyword_init: true)`); (b) `attr_reader :pid`; (c) dentro de `download`, guardar `@pid = wait.pid` al abrir el proceso y ponerlo a `nil` al terminar; (d) nuevo método público `cancel!`: si hay un `@pid` activo marca `@canceled = true` y envía la señal (`"TERM"` en macOS/Linux, `"KILL"` si `OS.windows?`) con `Process.kill`, ignorando `Errno::ESRCH`; si no hay descarga activa no hace nada ni lanza error; (e) cuando `download` termina con `@canceled` verdadero devuelve `Result.new(url:, ok: false, canceled: true, error: "Cancelado")`; al empezar cada `download` se reinicia `@canceled = false`. La firma `download(url){|event, data|}` y los eventos `:title`, `:progress`, `:done` NO cambian. Nueva opción `js_runtime:` (ruta de Deno): si está presente, `build_args` e `info` añaden los argumentos `"--js-runtimes", "deno:<ruta>"`; si no, no añaden nada.
      - |-
        `test/downloader_test.rb` — añadir casos (se omiten con `skip` si `VdlBtz::OS.windows?`): crear en un directorio temporal un ejecutable `fake-ytdlp` con el contenido `#!/bin/sh` + `exec sleep 30` y permiso 755; `Downloader.new(ytdlp: ruta, output: tmp)`; ejecutar `download` en un `Thread`, esperar (máximo 5 s) a que `pid` no sea `nil`, llamar `cancel!`, comprobar que `join(5)` termina, que `result.ok` es falso, `result.canceled` es verdadero, y que `Process.kill(0, pid)` lanza `Errno::ESRCH`. Casos extra: `cancel!` sin descarga activa no lanza error; un `Result` normal (`Result.new(url: "u", ok: true)`) tiene `canceled` nulo; y un caso con `js_runtime: "/bin/deno"` en el que `build_args` contiene `--js-runtimes` seguido de `deno:/bin/deno`, y otro sin la opción en el que no aparece `--js-runtimes`.
    acceptance:
      - |-
        WHEN `Downloader#cancel!` is called while `#download` is running THE SYSTEM SHALL terminate the child process and `#download` SHALL return a `Result` with `ok` false, `canceled` true and `error` `Cancelado` within 5 seconds.
      - |-
        WHEN `#download` has returned after a cancel THE SYSTEM SHALL leave no running child process (`Process.kill(0, pid)` raises `Errno::ESRCH`).
      - |-
        WHEN `#cancel!` is called while no download is running THE SYSTEM SHALL return without raising an error.
      - |-
        WHEN a `Result` is built without the `canceled` keyword THE SYSTEM SHALL report `canceled` as nil.
      - |-
        WHEN `rake test` runs THE SYSTEM SHALL exit 0 with the existing downloader tests unchanged in behaviour.
      - |-
        WHEN `Downloader` is built with `js_runtime: <path>` THE SYSTEM SHALL add `--js-runtimes deno:<path>` to the arguments of both `build_args` and `info`, and WHEN `js_runtime` is absent THE SYSTEM SHALL add no `--js-runtimes` argument.
    verify:
      - |-
        ruby -Ilib -Itest test/downloader_test.rb  # expect: exit 0, 0 failures, 0 errors (the cancel cases are skipped on Windows only)
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
  - id: E1-T4
    epic: 01-nucleo
    slug: installer-integrity
    priority: p0
    title: |-
      Verify yt-dlp SHA-256 and report install progress
    dependencies: []
    files:
      - lib/vdl_btz/installer.rb
      - lib/vdl_btz/cli.rb
      - test/installer_test.rb
    new_files:
      - test/installer_test.rb
    direction: |-
      La función de comprobación es pura y estática para poder probarla sin red. No cambies el orden de descarga existente: solo se inserta la verificación entre la descarga y el `chmod`. La integridad de ffmpeg queda fuera de este cambio (se documenta como riesgo aceptado).
    do:
      - |-
        `lib/vdl_btz/installer.rb` — (a) `Installer.new(bin_dir: Paths.bin_dir, on_progress: nil)` y `attr_accessor :on_progress`; (b) método de clase `Installer.verify_sha256!(path, sums_text, asset)`: busca en `sums_text` la línea que cumpla `/\A([0-9a-f]{64})  (.+)\z/` cuyo segundo grupo sea `asset`, calcula `Digest::SHA256.file(path).hexdigest` (`require "digest"`) y devuelve `true` si coinciden; si difieren, o si `asset` no aparece, lanza `VdlBtz::Error` con un mensaje en español que contiene `SHA-256` (por ejemplo `La verificación SHA-256 de #{asset} falló`); (c) en `install_ytdlp`, tras descargar a `tmp` y ANTES de `chmod` y de mover a `bin_dir`: descargar `YTDLP_RELEASES + "SHA2-256SUMS"` con el método `download` existente al archivo temporal `"#{target}.sums.part"`, leerlo, llamar `Installer.verify_sha256!(tmp, texto, ytdlp_asset)`; si lanza, el `ensure` existente borra `tmp` (y se amplía para borrar también `"#{target}.sums.part"`) y cualquier yt-dlp ya instalado queda intacto; (d) en `write_body`, además de `UI.progress`, llamar `on_progress.call(label, porcentaje)` si `on_progress` no es nulo (porcentaje entre 0 y 100; 0 cuando se desconoce el tamaño total).
      - |-
        `lib/vdl_btz/installer.rb` — DENO, el entorno de JavaScript que YouTube necesita (sin él yt-dlp solo ve audio y miniaturas en algunos videos y falla con «Requested format is not available»): constante `DENO_RELEASES = "https://github.com/denoland/deno/releases/latest/download/"`; `deno_path` (`find("deno")`); `deno_asset` devuelve `deno-<arch>-<sistema>.zip` con arch `aarch64` si `OS.arm?` y si no `x86_64`, y sistema `pc-windows-msvc` en Windows, `apple-darwin` en macOS o `unknown-linux-gnu` en Linux; `install_deno` descarga en un directorio temporal el `.zip` y su `<asset>.sha256sum` (misma forma `<64 hex>␣␣<archivo>` que SHA2-256SUMS), verifica el `.zip` con `Installer.verify_sha256!` ANTES de descomprimir, lo descomprime con `extract`, copia el ejecutable (`OS.exe("deno")`) a `bin_dir` con permiso 755 y comprueba que `deno --version` responde; `ensure_deno!` devuelve `deno_path` o llama a `install_deno` (lanza `VdlBtz::Error` si falla); `ensure_deno` hace lo mismo pero, ante cualquier error, avisa con `UI.warn` y devuelve `nil` (el CLI sigue sin Deno). `extract` prueba `tar -xf` y, si falla y el archivo es `.zip`, `unzip -o -q` (el `tar` de GNU en Linux no abre `.zip`); si no hay ninguno de los dos lanza `VdlBtz::Error` pidiendo instalar `tar` o `unzip`.
      - |-
        `lib/vdl_btz/cli.rb` — `build_downloader` llama a `@installer.ensure_deno` y pasa el resultado como `js_runtime:` a `Downloader.new`; el comando `info` pasa `@installer.deno_path` (sin descargar nada).
      - |-
        `test/installer_test.rb` — (1) `verify_sha256!` con un archivo temporal y un texto de sumas construido en el test con el SHA-256 real → `true`; (2) con un dígito alterado → `VdlBtz::Error` cuyo mensaje incluye `SHA-256`; (3) `asset` ausente → el mismo error; (4) una subclase de `Installer` que sobrescribe `download(url, dest, label:)` para escribir bytes de prueba (y, para la URL que termina en `SHA2-256SUMS`, un texto con la suma correcta o incorrecta): con suma correcta `install_ytdlp` deja `bin_dir/yt-dlp` (y se ejecuta con `VDL_BTZ_HOME` temporal; la comprobación de `--version` del final puede fallar con los bytes de prueba, por lo que la subclase también sobrescribe `version_of` para devolver `"test"`); con suma incorrecta lanza `VdlBtz::Error`, no existe `bin_dir/yt-dlp` y `Dir.glob(File.join(bin_dir, "*.part"))` está vacío; (5) `write_body` con un objeto de prueba que implementa `[]` (devuelve `"6"` para `content-length`) y `read_body` (cede dos fragmentos de 3 bytes) llama a `on_progress` dos veces con porcentajes 50 y 100; (6) Deno: `deno_asset` devuelve el nombre esperado para macOS Intel y Apple Silicon, Linux Intel y ARM y Windows (simulando `OS.windows?`, `OS.mac?` y `OS.arm?` con `minitest/mock`), y una subclase que sobrescribe `download` (escribe bytes y un `.sha256sum` correcto o incorrecto) y `extract` (crea `deno`) comprueba que con suma correcta `ensure_deno!` deja un `deno` ejecutable en `bin_dir`, y que con suma incorrecta lanza `VdlBtz::Error` con `SHA-256`, no instala nada y `ensure_deno` devuelve `nil`.
    acceptance:
      - |-
        WHEN `Installer.verify_sha256!(path, sums, asset)` is called with a file whose SHA-256 equals the entry for `asset` in `sums` THE SYSTEM SHALL return true.
      - |-
        WHEN the digest differs from the entry THE SYSTEM SHALL raise `VdlBtz::Error` whose message contains `SHA-256`.
      - |-
        WHEN `asset` has no entry in `sums` THE SYSTEM SHALL raise `VdlBtz::Error` whose message contains `SHA-256`.
      - |-
        WHEN `install_ytdlp` downloads yt-dlp THE SYSTEM SHALL fetch `SHA2-256SUMS` from the same release URL and verify the file before `chmod` and before moving it into `bin_dir`; on a mismatch THE SYSTEM SHALL raise `VdlBtz::Error`, leave no `yt-dlp` file and no `.part` file in `bin_dir`.
      - |-
        WHEN `on_progress` is set and a download body arrives in chunks THE SYSTEM SHALL call `on_progress.call(label, percent)` once per chunk with `percent` between 0 and 100.
      - |-
        WHEN `Installer#ensure_deno!` runs without a Deno in `bin_dir` THE SYSTEM SHALL download the `deno-<arch>-<os>` zip and its `.sha256sum` from the Deno release, verify the zip with `verify_sha256!` before extracting it and install an executable `deno` in `bin_dir`; on a checksum mismatch it SHALL raise `VdlBtz::Error` mentioning `SHA-256` and install nothing, and `ensure_deno` SHALL then return nil with a warning instead of raising.
    verify:
      - |-
        ruby -Ilib -Itest test/installer_test.rb  # expect: exit 0, 0 failures, 0 errors
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
  - id: E1-T5
    epic: 01-nucleo
    slug: job-queue
    priority: p0
    title: |-
      Add in-memory download job queue
    dependencies: [E1-T3]
    files:
      - lib/vdl_btz/gui/jobs.rb
      - lib/vdl_btz.rb
      - lib/vdl_btz/platform.rb
      - test/gui_jobs_test.rb
      - test/platform_test.rb
    new_files:
      - lib/vdl_btz/gui/jobs.rb
      - test/gui_jobs_test.rb
    direction: |-
      La cola no sabe nada de HTTP ni de yt-dlp: solo ejecuta el `runner` que le inyectan, por eso se prueba sin red. Protege la lista y los cambios de estado con un `Mutex` y no mantengas el candado mientras corre el `runner`. El `runner` real queda delgado a propósito (solo traduce eventos); no se prueba con descargas reales en CI.
    do:
      - |-
        `lib/vdl_btz/gui/jobs.rb` — clase `VdlBtz::GUI::JobQueue` (stdlib: `thread`, `securerandom`). `Job = Struct.new(:id, :url, :platform, :status, :title, :percent, :speed, :eta, :file, :error, :hint, :audio, :quality, keyword_init: true)`; `status` es uno de `"queued"`, `"running"`, `"done"`, `"error"`, `"canceled"`. `JobQueue.new(workers: 2, runner:)`: `runner` es un invocable `runner.call(job, control)` que devuelve un objeto con `ok`, `file`, `error`, `canceled` (por ejemplo `Downloader::Result`); `control` responde a `update(hash)` (cambia `title`, `percent`, `speed`, `eta` del trabajo), `canceled?` y `on_cancel { ... }` (registra el bloque que se ejecutará si se cancela el trabajo en marcha).
      - |-
        Métodos: `add(urls, audio:, quality:)` valida TODAS las URLs con `Platform.valid_url?`; si alguna es inválida lanza `VdlBtz::Error` con `URL inválida: <url>` y no encola ninguna; si todas son válidas crea un `Job` por URL (`id` = `SecureRandom.hex(4)`, `platform` = `Platform.detect(url)`, `status` `"queued"`, `percent` 0) y los devuelve; `list` devuelve un `Array` de `Hash` (`job.to_h`) en orden de inserción con exactamente las claves `id, url, platform, status, title, percent, speed, eta, file, error, hint, audio, quality`; `cancel(id)` devuelve `false` si no existe, marca `"canceled"` si estaba en cola (sin ejecutarlo nunca) o ejecuta el bloque de `on_cancel` si estaba en marcha, y devuelve `true`; `shutdown` cancela lo pendiente y detiene los hilos. Hay `workers` hilos que sacan ids de una `Queue` y ejecutan el `runner`; todo acceso al estado compartido va dentro de un `Mutex`. Resultado: `ok` → `"done"` y `file`; `canceled` (o cancelación pedida) → `"canceled"`; si no → `"error"` con `error` y `hint = Hints.for(error)`. Si el `runner` lanza una excepción → `"error"` con el mensaje de la excepción.
      - |-
        Método de clase `JobQueue.downloader_runner(installer:, config:)`: devuelve el `runner` real. Para cada trabajo crea un `Downloader.new(ytdlp: installer.ytdlp_path, ffmpeg: installer.ffmpeg_path, output: config["output"], quality: job.quality, audio: job.audio, cookies: config["cookies"], js_runtime: installer.deno_path)`, registra `control.on_cancel { downloader.cancel! }`, ejecuta `downloader.download(job.url)` traduciendo los eventos `:title` → `update(title:)` y `:progress` → `update(percent:, speed:, eta:)` (`data` es `[porcentaje, velocidad, eta]`) y devuelve el `Result`.
      - |-
        `lib/vdl_btz/platform.rb` — método `Platform.clean_url(url)`: para un enlace de YouTube (`detect` = `youtube`) que lleva el parámetro `list` y además `v` (o es de `youtu.be`), devuelve la misma URL sin los parámetros `list`, `index` y `start_radio`, conservando los demás (por ejemplo `t`) y sin signo `?` si no queda ninguno; los enlaces de playlist pura (`/playlist?list=...`, sin `v`), los de otros sitios y el texto inválido se devuelven iguales. `JobQueue#add` guarda en `url` el resultado de `Platform.clean_url`. El CLI NO lo usa: ya descarga un solo video con `--no-playlist` y su opción `-p` necesita la lista.
      - |-
        `lib/vdl_btz.rb` — añadir `require_relative "vdl_btz/gui/jobs"` junto al `require` del servidor.
      - |-
        `test/gui_jobs_test.rb` — con un `runner` de prueba que se bloquea en una `Queue` hasta que el test lo libera: (1) URLs válidas → un `Job` por URL con ids únicos; (2) una URL inválida entre válidas → `VdlBtz::Error` con la URL en el mensaje y `list` vacío; (3) con `workers: 2` y cuatro trabajos, el máximo de ejecuciones simultáneas observado es 2; (4) `runner` que devuelve `ok: true` → `done` con `file`, y que devuelve `ok: false, error: "This video is private"` → `error` con `hint` que contiene `cookies`; (5) `cancel` de un trabajo en cola → `canceled` sin llamar al `runner`, de uno en marcha → se ejecuta el bloque `on_cancel` y acaba `canceled`, de un id desconocido → `false`; (6) las claves de `list` son exactamente las del contrato y llegan en orden de inserción; (7) `https://www.youtube.com/watch?v=6-6aVn0wwYM&list=RD6-6aVn0wwYM&start_radio=1` queda como `https://www.youtube.com/watch?v=6-6aVn0wwYM`. Además `test/platform_test.rb` prueba `clean_url`: quita `list`, `index` y `start_radio`; conserva `t=30s`; `https://youtu.be/abc123?list=PL123` queda `https://youtu.be/abc123`; y una playlist pura, TikTok, Vimeo y `not-a-url` quedan iguales.
    acceptance:
      - |-
        WHEN `JobQueue#add(urls, audio:, quality:)` receives only valid http(s) URLs THE SYSTEM SHALL return one job per URL, each with a unique `id` and `status` `queued` or `running`, and with `url` passed through `Platform.clean_url`, which reduces a YouTube video link carrying `list` to the bare video link (dropping `list`, `index` and `start_radio` and keeping other parameters) and leaves playlist links, other sites and invalid text unchanged.
      - |-
        WHEN any URL is invalid according to `Platform.valid_url?` THE SYSTEM SHALL raise `VdlBtz::Error` whose message contains that URL and SHALL enqueue none of the URLs.
      - |-
        WHEN more jobs than `workers` are added THE SYSTEM SHALL run at most `workers` jobs at the same time.
      - |-
        WHEN the runner reports `ok` true THE SYSTEM SHALL set the job to `done` with its `file`, and WHEN it reports `ok` false with an `error` THE SYSTEM SHALL set the job to `error` and fill `hint` from `Hints.for(error)`.
      - |-
        WHEN `cancel(id)` is called THE SYSTEM SHALL mark a queued job `canceled` without running it, run the registered `on_cancel` block for a running job and end it `canceled`, and return false for an unknown id.
      - |-
        WHEN `list` is called THE SYSTEM SHALL return the jobs in insertion order as hashes with exactly the keys `id, url, platform, status, title, percent, speed, eta, file, error, hint, audio, quality`.
    verify:
      - |-
        ruby -Ilib -Itest test/gui_jobs_test.rb  # expect: exit 0, 0 failures, 0 errors
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
  - id: E2-T1
    epic: 02-pantalla
    slug: api-jobs
    priority: p0
    title: |-
      Add jobs API routes and wire the gui command
    dependencies: [E1-T2, E1-T5]
    files:
      - lib/vdl_btz/gui/api.rb
      - lib/vdl_btz/gui/server.rb
      - lib/vdl_btz.rb
      - lib/vdl_btz/cli.rb
      - test/gui_api_jobs_test.rb
    new_files:
      - lib/vdl_btz/gui/api.rb
      - test/gui_api_jobs_test.rb
    direction: |-
      `Api` no toca sockets: recibe un `Request` y devuelve un triple, así que se prueba sin red. Mantén el orden de validación fijo para que los códigos de error sean predecibles para la pantalla. El instalador falso del test es un objeto con los mismos métodos públicos que `Installer`.
    do:
      - |-
        `lib/vdl_btz/gui/server.rb` — si una ruta no es propia del servidor (`/api/health`, `/api/shutdown`, `/api/ping`) y `handler` no es nulo, llamar `handler.call(request)`; `request` es un `Struct` `Request(:method, :path, :query, :headers, :body)` (`headers` con claves en minúsculas, `query` como `Hash` de `String`) y el `handler` devuelve `[estado, cabeceras_extra, cuerpo_string]`; el servidor añade las cabeceras de seguridad, `Content-Length` y `Connection`. La autenticación por token de `/api/` sigue ocurriendo antes. Si `handler` devuelve `nil` → `404 not_found`.
      - |-
        `lib/vdl_btz/gui/api.rb` — clase `VdlBtz::GUI::Api` con `initialize(queue:, config:, installer:)` y `call(request)`; respuestas siempre en el sobre `{"ok":true,"data":...}` o `{"ok":false,"error":{"code":...,"message":...}}`. Rutas: `GET /api/state` → `data` con `version` (`VdlBtz::VERSION`), `os` (`OS.name`), `config` (`config.to_h`), `qualities` (`Config::QUALITIES`), `browsers` (`Config::BROWSERS`) y `setup` = `{ytdlp: <bool>, ffmpeg: <bool>, deno: <bool>, running: false, label: nil, percent: nil, error: nil}` donde `ytdlp`/`ffmpeg`/`deno` son `!installer.ytdlp_path.nil?` / `!installer.ffmpeg_path.nil?` / `!installer.deno_path.nil?`; `POST /api/jobs` con cuerpo JSON `{"urls":[...],"audio":bool,"quality":"..."}`; `GET /api/jobs` → `data.jobs` = `queue.list`; `POST /api/jobs/<id>/cancel` → `200` con `data.jobs` = `[el trabajo]` o `404 not_found`.
      - |-
        Validaciones de `POST /api/jobs`, en este orden: cuerpo que no es un objeto JSON → `400 bad_json`; `urls` ausente, vacío, con más de 20 elementos o con elementos que no son cadenas → `400 no_urls`; alguna URL inválida (`queue.add` lanza `VdlBtz::Error`) → `400 invalid_url` con el mensaje de la excepción; `quality` presente pero no válida según `Config.normalize_quality` → `400 invalid_quality` (si falta se usa `config["quality"]`); yt-dlp no instalado (`installer.ytdlp_path` nulo) → `409 setup_required`; éxito → `202` con `data.jobs`. `audio` falso por defecto.
      - |-
        `lib/vdl_btz.rb` — `require_relative "vdl_btz/gui/api"`. `lib/vdl_btz/cli.rb` — en `gui`: crear `queue = GUI::JobQueue.new(runner: GUI::JobQueue.downloader_runner(installer: @installer, config: @config))`, `api = GUI::Api.new(queue: queue, config: @config, installer: @installer)` y pasar `handler: api` a `Server.new`; al terminar `server.join` llamar `queue.shutdown`.
      - |-
        `test/gui_api_jobs_test.rb` — arranca `Server` en proceso con `Api` y una cola con `runner` falso (devuelve un objeto `ok: true` de inmediato) y un instalador falso (`ytdlp_path`/`ffmpeg_path`/`deno_path` devuelven una ruta o `nil`); comprueba cada criterio con `Net::HTTP`. Incluye un caso de extremo a extremo con subproceso: `bin/vdl-btz gui --no-window` responde `GET /api/jobs` con `200` y `data.jobs == []` y se apaga con `POST /api/shutdown`.
    acceptance:
      - |-
        WHEN `GET /api/state` is requested with a valid token THE SYSTEM SHALL respond `200` with `data` containing the keys `version, os, config, qualities, browsers, setup`, where `setup` contains the keys `ytdlp, ffmpeg, deno, running, label, percent, error`.
      - |-
        WHEN `POST /api/jobs` receives `{"urls":["https://youtu.be/abc123"],"audio":false,"quality":"720"}` and yt-dlp is installed THE SYSTEM SHALL respond `202` with `data.jobs` holding one job whose `status` is `queued` or `running`.
      - |-
        WHEN the body is not a JSON object, or `urls` is missing, empty, longer than 20 or not strings, or a URL is invalid, or `quality` is not in `Config::QUALITIES`, THE SYSTEM SHALL respond `400` with the codes `bad_json`, `no_urls`, `invalid_url` or `invalid_quality` respectively and enqueue nothing.
      - |-
        WHEN `POST /api/jobs` arrives while yt-dlp is not installed THE SYSTEM SHALL respond `409` with error code `setup_required` and enqueue nothing.
      - |-
        WHEN `GET /api/jobs` is requested THE SYSTEM SHALL respond `200` with `data.jobs`, and WHEN `POST /api/jobs/<id>/cancel` targets a known job THE SYSTEM SHALL respond `200` and for an unknown id `404` with error code `not_found`.
      - |-
        WHEN `ruby bin/vdl-btz gui --no-window` is running THE SYSTEM SHALL answer `GET /api/jobs` with `200` and `data.jobs` equal to `[]`.
    verify:
      - |-
        ruby -Ilib -Itest test/gui_api_jobs_test.rb  # expect: exit 0, 0 failures, 0 errors
      - |-
        ruby -Ilib -Itest test/gui_boot_test.rb  # expect: exit 0, 0 failures, 0 errors (earlier gate still passes)
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
  - id: E2-T2
    epic: 02-pantalla
    slug: api-settings
    priority: p0
    title: |-
      Add settings, engine update and open-folder API
    dependencies: [E1-T4, E2-T1]
    files:
      - lib/vdl_btz/gui/api.rb
      - lib/vdl_btz/os.rb
      - test/test_helper.rb
      - test/gui_api_settings_test.rb
    new_files:
      - test/gui_api_settings_test.rb
    direction: |-
      Esta es la primera tarea que escribe en disco (`config.yml`), así que el test lee el archivo real. Valida primero, persiste después: un cuerpo con una calidad válida y un navegador inválido no debe cambiar nada. Las instalaciones corren en un hilo; protege el estado compartido con un `Mutex`.
    do:
      - |-
        `lib/vdl_btz/os.rb` — método de módulo `OS.open_path(path)`: abre una carpeta en el explorador del sistema con un ARRAY de argumentos (nunca una cadena de shell): `["open", path]` en macOS, `["explorer", path]` en Windows, `["xdg-open", path]` en Linux; usa `Process.spawn(*args, out: File::NULL, err: File::NULL)` seguido de `Process.detach`, devuelve `true`, y devuelve `false` si lanza `SystemCallError`.
      - |-
        `lib/vdl_btz/gui/api.rb` — `Api.new` acepta además `opener: OS.method(:open_path)` (invocable) para poder probarla. Rutas nuevas: `POST /api/config` con JSON de las claves `output`, `quality`, `cookies` (cualquier subconjunto): primero VALIDA todas sin escribir (`Config#set` guarda en disco al validar, así que no sirve para validar): `quality` debe cumplir `Config.normalize_quality(valor)` no nulo; `cookies` debe ser `none`, `ninguno`, `no`, `off` (sin distinguir mayúsculas) o cumplir `Config.normalize_browser(valor)` no nulo; `output` debe ser una cadena no vacía; cualquier otra clave o valor inválido → `400 invalid_config` con un mensaje en español y el archivo `Paths.config_file` no cambia ni un byte. Solo si todo es válido llama `config.set(clave, valor)` para cada clave y responde `200` con `data.config`.
      - |-
        `POST /api/setup`: si ya hay una instalación en marcha → `409 already_running`; si no, marca `setup.running` verdadero y lanza un hilo que ejecuta `installer.ensure_ytdlp!`, después `installer.ensure_ffmpeg` y por último `installer.ensure_deno!` (como sentencias seguidas, no encadenadas con `&&`: `ensure_ffmpeg` devuelve `nil` si falla y no debe impedir instalar Deno), y responde `202` con `data.setup`. `POST /api/engine/update`: igual, pero el hilo ejecuta `installer.install_ytdlp`. Ambos fijan `installer.on_progress = ->(label, percent) { ... }` para actualizar `setup.label` y `setup.percent`; al terminar `running` pasa a falso, `label` y `percent` a nulo y, si el hilo lanzó una excepción, `setup.error` es su mensaje. `GET /api/state` devuelve este estado actualizado (`ytdlp`/`ffmpeg` se recalculan en cada llamada).
      - |-
        `POST /api/open`: con cuerpo `{"id":"<id>"}` busca el trabajo en `queue.list`; si existe y tiene `file`, llama `opener.call(File.dirname(file))` y responde `200` con `data` `{"opened":true}`; si el id no existe o no tiene `file` → `404 no_file`. Con cuerpo `{}` crea (si falta) `config["output"]` con `FileUtils.mkdir_p` y lo abre. El cliente nunca envía una ruta.
      - |-
        `test/test_helper.rb` — AISLAR LA CARPETA PERSONAL: justo después de fijar `ENV["VDL_BTZ_HOME"]` y antes de `require "vdl_btz"`, añadir `ENV["HOME"] = ENV["VDL_BTZ_HOME"]`, de modo que `Dir.home` (y con él la carpeta de salida por defecto `~/Downloads/vdl-btz`) apunte al directorio temporal. Desde este paso ninguna prueba puede tocar la carpeta personal real; ninguna prueba crea ni borra nada fuera de directorios temporales (`Dir.mktmpdir`), ni usa `rm_rf` sobre una ruta que no haya comprobado que está bajo `Dir.tmpdir`.
      - |-
        `test/gui_api_settings_test.rb` — con `VDL_BTZ_HOME` temporal (ya lo hace `test_helper`), un instalador falso con `ensure_ytdlp!`, `ensure_ffmpeg`, `ensure_deno!`, `install_ytdlp`, `ytdlp_path`, `ffmpeg_path`, `deno_path`, `on_progress=` y un `opener` que registra las rutas: comprueba cada criterio; la prueba de configuración lee `Paths.config_file` del disco y compara su contenido YAML antes y después.
    acceptance:
      - |-
        WHEN `POST /api/config` receives valid values for `output`, `quality` and `cookies` THE SYSTEM SHALL write them to the file at `Paths.config_file` and respond `200` with `data.config` reflecting them.
      - |-
        WHEN any submitted config value is invalid (for example `quality` `999` or `cookies` `netscape`) THE SYSTEM SHALL respond `400` with error code `invalid_config` and leave the config file byte-for-byte unchanged.
      - |-
        WHEN `POST /api/setup` is requested and yt-dlp, ffmpeg or Deno is missing THE SYSTEM SHALL respond `202`, run `ensure_ytdlp!`, `ensure_ffmpeg` and `ensure_deno!` in that order in a background thread (ffmpeg is optional: its failure SHALL NOT stop Deno from being installed), expose `setup.running`, `setup.label` and `setup.percent` through `GET /api/state` while `on_progress` is called, and finish with `running` false.
      - |-
        WHEN the background install raises an error THE SYSTEM SHALL set `setup.error` to the error message with `running` false, and WHEN `POST /api/setup` or `POST /api/engine/update` arrives while `running` is true THE SYSTEM SHALL respond `409` with error code `already_running`.
      - |-
        WHEN `POST /api/engine/update` is requested THE SYSTEM SHALL respond `202` and run `install_ytdlp` in a background thread with the same `setup` fields.
      - |-
        WHEN `POST /api/open` receives the id of a job that has a `file` THE SYSTEM SHALL call the opener with that file's directory and respond `200`; for an unknown id or a job without `file` it SHALL respond `404` with error code `no_file`; for `{}` it SHALL create the configured output folder if missing and open it; and WHEN any test runs THE SYSTEM SHALL have `ENV["HOME"]` equal to the temporary `ENV["VDL_BTZ_HOME"]`, so `Dir.home` never points at the real home folder.
    verify:
      - |-
        ruby -Ilib -Itest -e 'require "test_helper"; abort("HOME is not isolated") unless ENV["HOME"] == ENV["VDL_BTZ_HOME"] && Dir.home == ENV["HOME"]'  # expect: exit 0 (tests never touch the real home folder)
      - |-
        ruby -Ilib -Itest test/gui_api_settings_test.rb  # expect: exit 0, 0 failures, 0 errors
      - |-
        ruby -Ilib -Itest test/gui_api_jobs_test.rb  # expect: exit 0, 0 failures, 0 errors (step 6 gate still passes)
      - |-
        rake test  # expect: exit 0, 0 failures, 0 errors
  - id: E2-T3
    epic: 02-pantalla
    slug: static-page
    priority: p0
    title: |-
      Serve the newspaper-style page and its assets
    dependencies: [E2-T1]
    files:
      - lib/vdl_btz/gui/assets/index.html
      - lib/vdl_btz/gui/assets/app.css
      - lib/vdl_btz/gui/server.rb
      - vdl-btz.gemspec
      - test/gui_assets_test.rb
    new_files:
      - lib/vdl_btz/gui/assets/index.html
      - lib/vdl_btz/gui/assets/app.css
      - test/gui_assets_test.rb
    direction: |-
      El servidor solo sirve una lista blanca fija de nombres: así no hay recorrido de directorios posible. El token entra en la página como `<meta>` (no en un script en línea) porque la política CSP prohíbe scripts y estilos en línea. Usa la paleta y las reglas del diseño tal como aparecen en el contrato de diseño (plano §7 y §19.6; en la épica, sección Contracts); no inventes colores de acento (el diseño es monocromo).
    do:
      - |-
        Las tres fuentes ya existen en `lib/vdl_btz/gui/assets/fonts/` (las trajo la copia de `workspace/`): `hanken-grotesk-var.woff2`, `space-mono-400.woff2`, `space-mono-700.woff2`. NO las descargues ni las modifiques.
      - |-
        `lib/vdl_btz/gui/server.rb` — constante `ASSETS_DIR = File.expand_path("assets", __dir__)`. `GET /` exige el parámetro de consulta `t` igual al token (si no → `401` con el sobre JSON `unauthorized`) y responde `200` `text/html; charset=utf-8` con el contenido de `index.html` donde la cadena `__VDL_TOKEN__` se sustituye por el token. `GET /assets/<ruta>` sirve SOLO esta lista blanca, con estos tipos: `app.css` → `text/css; charset=utf-8`, `app.js` → `text/javascript; charset=utf-8`, `fonts/hanken-grotesk-var.woff2`, `fonts/space-mono-400.woff2`, `fonts/space-mono-700.woff2` → `font/woff2`; cualquier otra ruta, incluida cualquiera con `..`, → `404 not_found`; si el archivo de la lista no existe todavía → `404`. Los assets no requieren token. Lee los archivos con `File.binread` desde `ASSETS_DIR` (no uses rutas relativas al directorio actual).
      - |-
        `lib/vdl_btz/gui/assets/index.html` — documento en español (`<html lang="es">`), UTF-8, `<meta name="viewport" content="width=device-width, initial-scale=1">`, `<meta name="vdl-token" content="__VDL_TOKEN__">`, `<link rel="stylesheet" href="/assets/app.css">` y `<script src="/assets/app.js" defer></script>`; SIN scripts ni estilos en línea y sin atributos `style=`. Estructura semántica y los ids exactos del contrato DOM (plano §6; en la épica, sección Contracts): masthead, formulario, cola, ajustes, pantalla de preparación y aviso legal; la lista de descargas es `<ol id="jobs" tabindex="0" aria-label="Lista de descargas">`.
      - |-
        `lib/vdl_btz/gui/assets/app.css` — el sistema de diseño (plano §7 y §19.6; en la épica, sección Contracts): variables `:root` claro, bloque oscuro por `@media (prefers-color-scheme: dark)` (guardado con `:root:not([data-theme="light"])`) y por `:root[data-theme="dark"]`, `@font-face` de las tres fuentes con `font-display: swap`, filetes de 1–2 px, etiquetas en mayúsculas con `letter-spacing`, rejilla de dos columnas a partir de 900 px (la columna derecha ocupa el alto de la izquierda y `#jobs` hace scroll interno con `overflow-y:auto`; por debajo de 900 px `#jobs` tiene `max-height: 70vh` con scroll), textura de grano con `body::before` (SVG en `data:`), foco visible de 2 px y `@media (prefers-reduced-motion: reduce)`.
      - |-
        `vdl-btz.gemspec` — cambiar `spec.files` a `Dir["lib/**/*.{rb,html,css,js,woff2}", "bin/*", "README.md", "LICENSE"]` para que la gema incluya las páginas y fuentes.
      - |-
        `test/gui_assets_test.rb` — arranca `Server` en proceso con token conocido y comprueba cada criterio (HTML, CSS, fuentes con `Digest::SHA256`, rutas fuera de la lista blanca, `Gem::Specification.load("vdl-btz.gemspec").files`). Incluye un caso que comprueba el `tabindex="0"` de `#jobs` y una regla `#jobs{... overflow-y:auto}` en el CSS.
    acceptance:
      - |-
        WHEN `GET /?t=<token>` is requested THE SYSTEM SHALL respond `200` with `Content-Type: text/html; charset=utf-8` and a body containing `<meta name="vdl-token" content="<token>">`, and WHEN `t` is missing or wrong THE SYSTEM SHALL respond `401` with the JSON error code `unauthorized`.
      - |-
        WHEN the served HTML is inspected THE SYSTEM SHALL contain every element id of the DOM contract (`masthead`, `dateline`, `theme-toggle`, `setup`, `setup-label`, `setup-progress`, `form-add`, `urls`, `mode-video`, `mode-audio`, `quality`, `btn-add`, `msg`, `jobs`, `empty`, `cfg-output`, `cfg-quality`, `cfg-cookies`, `btn-save-config`, `btn-update-engine`, `legal`), no inline `<script>` content and no `style=` attribute, and the `jobs` list SHALL carry `tabindex="0"` so the scrollable list can be reached with the keyboard.
      - |-
        WHEN `GET /assets/app.css` is requested THE SYSTEM SHALL respond `200` with `Content-Type: text/css; charset=utf-8` and a body containing the literals `--paper:#ece9e1`, `--ink:#000000`, `--paper:#0c0b09`, `--ink:#ede8db`, `prefers-color-scheme`, `Hanken Grotesk`, `Space Mono` and a rule giving `#jobs` the declaration `overflow-y:auto`.
      - |-
