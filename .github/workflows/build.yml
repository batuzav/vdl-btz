name: Build

on:
  workflow_dispatch:      # botón "Run workflow" en la pestaña Actions
  push:
    branches: [master]    # cada push a master ejecuta tests y binarios
    tags: ["v*"]          # al subir una etiqueta (v0.2.0) también publica un Release
  pull_request:

permissions:
  contents: write         # necesario para crear el Release

jobs:
  test:
    name: Tests (Ruby ${{ matrix.ruby }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  binary:
    name: Binario ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false   # si un sistema falla, los demás siguen
      matrix:
        include:
          - { os: macos-15,       target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: ubuntu-24.04,   target: linux-x64 }
          # Windows es experimental: Tebako en Windows con el modo fat no está probado y no debe bloquear los demás.
          - { os: windows-latest, target: windows-x64, experimental: true }
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Dependencias de Tebako (macOS)
        if: runner.os == 'macOS'
        run: |
          gem install tebako
          brew bundle --file "$(gem contents tebako | grep '/Brewfile$')"

      - name: Dependencias de Tebako (Linux)
        if: runner.os == 'Linux'
        run: |
          gem install tebako
          sudo apt-get update
          sudo apt-get -y install git curl build-essential pkg-config bison flex autoconf cmake \
            binutils-dev libevent-dev acl-dev libfmt-dev libjemalloc-dev libiberty-dev \
            libdouble-conversion-dev liblz4-dev liblzma-dev libssl-dev libunwind-dev \
            libboost-filesystem-dev libboost-program-options-dev libboost-system-dev \
            libboost-iostreams-dev libboost-date-time-dev libboost-context-dev \
            libboost-regex-dev libboost-thread-dev libbrotli-dev libdwarf-dev libelf-dev \
            libgoogle-glog-dev libffi-dev libgdbm-dev libyaml-dev libncurses-dev \
            libreadline-dev libutfcpp-dev

      # Se empaqueta solo bin/ y lib/. Sin Gemfile Tebako no necesita Bundler,
      # y el binario no lleva tests ni archivos de desarrollo.
      - name: Preparar carpeta de empaquetado
        shell: bash
        run: |
          mkdir stage
          cp -R bin lib stage/

      # `press` con runtime precompilado exige haber ejecutado `setup` antes
      # (prepara el entorno de Ruby y la herramienta mkdwarfs).
      - name: Preparar entorno de Tebako
        if: runner.os != 'Windows'
        run: tebako setup --Ruby=3.3.7

      - name: Empaquetar con Tebako
        if: runner.os != 'Windows'
        run: |
          tebako press \
            --root=stage \
            --entry-point=bin/vdl-btz \
            --output=vdl-btz-${{ matrix.target }} \
            --Ruby=3.3.7 \
            --mode=fat

      - name: Prueba rápida del binario
        if: runner.os != 'Windows'
        run: |
          chmod +x vdl-btz-${{ matrix.target }}
          ./vdl-btz-${{ matrix.target }} version
          ./vdl-btz-${{ matrix.target }} help

      - name: Empaquetar app de macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          sh packaging/macos/make_app.sh vdl-btz-${{ matrix.target }} ${{ matrix.target }} "$(ruby -Ilib -e 'require "vdl_btz"; print VdlBtz::VERSION')" dist

      - name: Descargar appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage && chmod +x appimagetool && sudo mv appimagetool /usr/local/bin/

      - name: Empaquetar AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          sh packaging/linux/make_appimage.sh vdl-btz-${{ matrix.target }} x86_64 dist

      - name: Preparar MSYS2 para Tebako
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call gem install tebako -v 0.15.9
          call ridk enable ucrt64
          pacman -S --noconfirm git tar bison flex pactoys make
          bash -c "pacboy sync --noconfirm toolchain:p make:p cmake:p boost:p diffutils:p libevent:p double-conversion:p fmt:p glog:p dlfcn:p gtest:p autotools:p ncurses:p libyaml:p"

      # Parches a Tebako 0.15.9 (se aplican al gem instalado):
      # 1. Tebako fuerza `-G "MinGW Makefiles"`, que escribe recetas de cmd.exe; con sh.exe en el PATH
      #    (MSYS2/Git) make las ejecuta con sh y falla ("'mTC_xxx.dir' is not recognized").
      #    "MSYS Makefiles" es el generador pensado para ese caso. Ninja no sirve: Tebako avisa que rompe `press`.
      # 2. Llama a `C:/.../configure` de Ruby; autoconf parte la ruta por los ":" del disco y dice
      #    "cannot find required auxiliary files". Con `./configure` (se compila en el propio directorio) no hay ":".
      # 3. En Windows el configure de Ruby prefiere clang (el LLVM del runner, que no enlaza con MinGW):
      #    se le pasa CC=gcc CXX=g++ como argumento, porque las variables de entorno no le llegaban.
      - name: Parchear Tebako para Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir="$(dirname "$(gem contents tebako -v 0.15.9 | grep 'lib/tebako/scenario_manager.rb$')")/../.."
          sed -i 's/"MinGW Makefiles"/"MSYS Makefiles"/' "$dir/lib/tebako/scenario_manager.rb"
          sed -i 's|\${RUBY_SOURCE_DIR}/configure |./configure CC=gcc CXX=g++ |' "$dir/CMakeLists.txt"
          grep -n 'MSYS Makefiles' "$dir/lib/tebako/scenario_manager.rb"
          grep -n '\./configure CC=gcc' "$dir/CMakeLists.txt"

      # Cada paso arranca una shell nueva: el entorno de MSYS2 se activa dentro del mismo paso que compila.
      - name: Empaquetar binario de Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call ridk enable ucrt64
          rem El configure de Ruby elegía clang (LLVM del runner) y no podía enlazar: se fuerza el gcc de ucrt64.
          set CC=gcc
          set CXX=g++
          call tebako setup --Ruby=3.3.7
          rem Tebako 0.15.9 no publica runtime precompilado para Windows (fat/lean lo exigen): modo bundle, compilado desde el código.
          call tebako press --root=stage --entry-point=bin/vdl-btz --output=vdl-btz-windows-x64.exe --Ruby=3.3.7 --mode=bundle --runtime=source

      - name: Diagnóstico de Tebako (Windows)
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: tail -n 60 "$HOME/.tebako/deps/src/_ruby_3.3.7/config.log" || true

      - name: Prueba rápida del binario de Windows
        if: runner.os == 'Windows'
        shell: bash
        run: ./vdl-btz-windows-x64.exe version

      - name: Guardar versión del programa
        if: runner.os == 'Windows'
        shell: bash
        run: echo "VDL_VERSION=$(ruby -Ilib -e 'require "vdl_btz"; print VdlBtz::VERSION')" >> "$GITHUB_ENV"

      - name: Crear instalador
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=%VDL_VERSION% packaging\windows\vdl-btz.iss

      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: vdl-btz-${{ matrix.target }}
          path: vdl-btz-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: vdl-btz-${{ matrix.target }}-app
          path: dist/*.dmg

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vdl-btz-${{ matrix.target }}-appimage
          path: dist/*.AppImage

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: vdl-btz-windows-x64-setup
          path: dist/vdl-btz-windows-x64-setup.exe

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
